<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Go Cookie Dough — Kitchen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Special+Elite&display=swap');

  :root{
    --dough:#454A5E;
    --rail:#343849;
    --cream:#F7F1E3;
    --paper:#FBF4E4;
    --paper-shadow: rgba(0,0,0,0.35);
    --butter:#D9993D;
    --sky:#8FC1DE;
    --jam:#C1442E;
    --ok:#5B8C5A;
    --line: rgba(247,241,227,0.14);
    --ink:#1B2430;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--dough); color:var(--cream);
    font-family:'Nunito',sans-serif; overflow-x:hidden; min-height:100vh;
  }
  h1,h2,.display{font-family:'Fredoka',sans-serif;}

  /* ---------- config ---------- */
  #configBtn{
    position:fixed; top:10px; right:10px; z-index:50;
    width:34px; height:34px; border-radius:50%;
    background:rgba(247,241,227,0.08); border:1px solid var(--line);
    color:var(--cream); font-size:16px; cursor:pointer;
  }
  #soundBtn{
    position:fixed; top:10px; right:52px; z-index:50;
    width:34px; height:34px; border-radius:50%;
    background:rgba(247,241,227,0.08); border:1px solid var(--line);
    color:var(--cream); font-size:16px; cursor:pointer;
  }
  #soundBtn.muted{opacity:.4;}
  #configPanel{
    position:fixed; top:0; right:0; height:100%; width:320px; max-width:88vw;
    background:#241813; border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .25s ease;
    z-index:49; padding:60px 20px 20px; overflow-y:auto;
  }
  #configPanel.open{transform:translateX(0);}
  #configPanel label{display:block; font-size:12px; opacity:.75; margin:14px 0 4px;}
  #configPanel input, #configPanel select{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:rgba(247,241,227,0.06); color:var(--cream); font-size:14px;
  }
  #configPanel .savedNote{font-size:12px; color:var(--ok); margin-top:10px; display:none;}

  /* ---------- header / tabs ---------- */
  header{padding:20px 20px 0; text-align:center;}
  header .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.55;}
  header h1{
    font-size:26px; margin:2px 0 14px; color:var(--cream);
    text-shadow:
      -1.5px -1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px 1.5px 0 var(--ink),
      0 3px 0 var(--sky);
  }

  #tabs{display:flex; justify-content:center; gap:8px; padding:0 16px 16px; flex-wrap:wrap;}
  #tabs button{
    background:rgba(247,241,227,0.06); border:1px solid var(--line); color:var(--cream);
    padding:10px 18px; border-radius:24px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:'Nunito',sans-serif;
  }
  #tabs button.active{background:var(--butter); color:var(--ink); border-color:var(--butter);}
  #tabs button .count{
    display:inline-block; margin-left:6px; background:rgba(0,0,0,0.2);
    border-radius:10px; padding:1px 7px; font-size:12px;
  }
  #tabs button.active .count{background:rgba(0,0,0,0.15);}

  /* ---------- rail ---------- */
  #railWrap{position:relative; padding:36px 0 40px;}
  #railWrap::before{
    content:''; position:absolute; top:20px; left:0; right:0; height:6px;
    background:linear-gradient(180deg,#4a3229,#241813);
    box-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  #rail{
    display:flex; gap:26px; overflow-x:auto; padding:0 30px 20px;
    scroll-snap-type:x proximity;
  }
  .ticket{
    scroll-snap-align:start;
    --ticket-paper: var(--paper);
    flex:0 0 270px; background:var(--ticket-paper); color:var(--ink);
    border-radius:2px; padding:18px 16px 16px; position:relative;
    box-shadow:0 10px 18px var(--paper-shadow);
    font-family:'Nunito',sans-serif;
    transition:background-color 0.4s ease;
  }
  .ticket.ticket-yellow{ --ticket-paper: #F3DFA0; }
  .ticket.ticket-red{ --ticket-paper: #F0B3A8; }
  .ticket::before{
    content:''; position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    width:10px; height:10px; border-radius:50%;
    background:#8a8a8a; box-shadow:0 -18px 0 -2px #8a8a8a, inset 0 1px 2px rgba(0,0,0,0.4);
  }
  .ticket::after{
    content:''; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:2px; height:14px; background:#8a8a8a;
  }
  .ticket .jagged{
    position:absolute; top:0; left:0; right:0; height:8px;
    background:
      linear-gradient(135deg, var(--ticket-paper) 50%, transparent 50%) 0 0/10px 10px,
      linear-gradient(-135deg, var(--ticket-paper) 50%, transparent 50%) 0 0/10px 10px;
    background-color:var(--dough);
  }
  .ticket .ttop{display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;}
  .ticket .tname{font-size:22px; font-weight:800;}
  .ticket .ttruck{font-size:13px; text-transform:uppercase; letter-spacing:.06em; opacity:.6;}
  .ticket .telapsed{font-size:14px; margin:4px 0 12px; opacity:.65;}
  .ticket .telapsed.warn{color:var(--jam); font-weight:700;}
  .ticket hr{border:none; border-top:1px dashed rgba(44,29,25,0.3); margin:8px 0;}
  .ticket .litem{display:flex; justify-content:space-between; font-size:22px; font-weight:800; padding:4px 0;}
  .ticket .litem .q{font-weight:800; margin-right:6px;}
  .ticket .bumpBtn{
    margin-top:14px; width:100%; padding:14px; border:none; border-radius:6px;
    background:var(--ok); color:#fff; font-family:'Nunito',sans-serif; font-weight:800;
    font-size:17px; letter-spacing:.03em; cursor:pointer;
  }
  .ticket .bumpBtn:active{opacity:.8;}
  .ticket .voidBtn{
    position:absolute; top:10px; right:10px; z-index:3;
    width:26px; height:26px; border-radius:50%; border:1px solid rgba(44,29,25,0.2);
    background:rgba(44,29,25,0.06); color:rgba(44,29,25,0.55);
    font-size:13px; line-height:1; cursor:pointer;
  }
  .ticket .voidBtn:active{background:rgba(193,68,46,0.2); color:var(--jam);}
  .ticket .watchLabel{
    margin-top:14px; width:100%; padding:14px; border-radius:6px;
    background:rgba(44,29,25,0.06); color:var(--ink); font-family:'Nunito',sans-serif; font-weight:700;
    font-size:16px; letter-spacing:.03em; text-align:center; opacity:.7;
  }
  .ticket .doneStamp{
    position:absolute; top:34%; left:50%; transform:translate(-50%,-50%) rotate(-14deg);
    border:3px solid var(--ok); color:var(--ok); font-family:'Fredoka',sans-serif;
    font-weight:700; font-size:26px; padding:5px 18px; border-radius:6px; opacity:.85;
  }
  .ticket .cashFlag{
    background:var(--jam); color:#fff; font-family:'Nunito',sans-serif; font-weight:800;
    font-size:18px; line-height:1.3; text-align:center; padding:10px 8px;
    border-radius:8px; margin:8px 0 14px; letter-spacing:.02em;
    box-shadow:0 2px 6px rgba(193,68,46,0.4);
  }
  .ticket .resyncBadge{
    background:var(--butter); color:var(--ink); font-family:'Nunito',sans-serif; font-weight:800;
    font-size:14px; line-height:1.3; text-align:center; padding:8px 8px;
    border-radius:8px; margin:4px 0 12px; letter-spacing:.01em;
  }
  .ticket .doneTime{font-size:13px; opacity:.55; margin-top:10px;}
  .ticket .reopenBtn{
    margin-top:12px; width:100%; padding:10px; border:1px solid var(--line); border-radius:6px;
    background:transparent; color:var(--ink); opacity:.65; font-family:'Nunito',sans-serif; font-weight:700;
    font-size:14px; cursor:pointer;
  }
  .ticket .reopenBtn:active{opacity:1; background:rgba(44,29,25,0.06);}

  #emptyState{
    text-align:center; opacity:.5; padding:40px 20px; font-size:14px;
  }

  /* ---------- totals ---------- */
  #totalsView{max-width:480px; margin:0 auto; padding:10px 20px 60px; display:none;}
  #totalsView .statRow{
    display:flex; justify-content:space-between; padding:14px 4px;
    border-bottom:1px solid var(--line); font-size:15px;
  }
  #totalsView .statRow .name{font-weight:700;}
  #totalsView .statRow .qty{color:var(--butter); font-family:'Fredoka',sans-serif; font-size:17px;}
  #totalsView .summaryCard{
    background:rgba(247,241,227,0.06); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:20px; display:flex; justify-content:space-between;
  }
  #totalsView .summaryCard .big{font-family:'Fredoka',sans-serif; font-size:26px; color:var(--butter);}
  #totalsView .summaryCard .label{font-size:11px; opacity:.6; text-transform:uppercase; letter-spacing:.06em;}
  #totalsView .compareHeading{
    font-family:'Fredoka',sans-serif; font-size:16px; margin:26px 0 12px; opacity:.85;
  }
  #totalsView .compareRow{display:flex; gap:12px;}
  #totalsView .compCard{
    flex:1; background:rgba(247,241,227,0.06); border:1px solid var(--line); border-radius:12px;
    padding:12px 10px; text-align:center;
  }
  #totalsView .compTitle{font-size:12px; font-weight:800; opacity:.75;}
  #totalsView .compDate{font-size:11px; opacity:.5; margin-bottom:8px;}
  #totalsView .compOrders{font-size:12px; opacity:.7;}
  #totalsView .compRevenue{font-family:'Fredoka',sans-serif; font-size:19px; color:var(--butter); margin-top:2px;}
  #totalsView .compNoData{font-size:12px; opacity:.4; padding:6px 0;}
  #totalsView .compLoading{font-size:13px; opacity:.5; padding:10px; width:100%; text-align:center;}
</style>
</head>
<body>

<button id="soundBtn" onclick="toggleSound()">🔔</button>
<button id="configBtn" onclick="document.getElementById('configPanel').classList.toggle('open')">⚙</button>
<div id="configPanel">
  <h3 style="margin:0 0 4px;">Setup</h3>
  <p style="font-size:12px; opacity:.6; margin:0;">Saved to this device's browser only.</p>

  <label>Supabase Project URL</label>
  <input id="cfgSupaUrl" placeholder="https://xxxxx.supabase.co">

  <label>Supabase Publishable Key</label>
  <input id="cfgSupaKey" placeholder="sb_publishable_...">

  <label>Power Automate — Bump Order Flow URL</label>
  <input id="cfgBumpUrl" placeholder="https://prod-xx...invoke?...">

  <label>Power Automate — Void Order Flow URL</label>
  <input id="cfgVoidUrl" placeholder="https://prod-xx...invoke?...">

  <label>Power Automate — Reopen Order Flow URL</label>
  <input id="cfgReopenUrl" placeholder="https://prod-xx...invoke?...">

  <label>Truck</label>
  <select id="cfgTruck">
    <option value="all">All</option>
    <option value="van">Van</option>
    <option value="trailer">Trailer</option>
  </select>

  <button onclick="saveConfig()" style="margin-top:18px; width:100%; padding:10px; border-radius:8px; border:none; background:var(--butter); color:var(--ink); font-weight:800; cursor:pointer;">Save</button>
  <div class="savedNote" id="savedNote">Saved ✓</div>
</div>

<header>
  <div class="eyebrow">Let's Go Cookie Dough</div>
  <h1>Kitchen</h1>
</header>

<div id="tabs">
  <button id="tabOpen" class="active" onclick="switchTab('open')">Open Orders<span class="count" id="openCount">0</span></button>
  <button id="tabDone" onclick="switchTab('done')">Completed<span class="count" id="doneCount">0</span></button>
  <button id="tabTotals" onclick="switchTab('totals')">Today's Totals</button>
</div>

<div id="railWrap">
  <div id="rail"></div>
  <div id="emptyState" style="display:none;"></div>
</div>

<div id="totalsView">
  <div id="totalsLiveStats"></div>
  <div class="compareHeading">How today compares</div>
  <div class="compareRow" id="compareRow">
    <div class="compLoading">Loading…</div>
  </div>
</div>

<script>
let MENU_NAMES = {};

// ============================================================
// DEFAULT CONFIG — pre-fills the setup panel on a fresh device.
// The gear icon still works normally and can override any of these
// on-device at any time; this just saves retyping the values that
// never change between devices.
// ============================================================
const DEFAULT_CONFIG = {
  supaUrl: 'https://yybeoshbfutlaxcknbcw.supabase.co',
  supaKey: 'sb_publishable_w0fyA7GpxuV_DiIBNZ5Lxw_RPHBSMKW',
  bumpUrl: 'https://default43cd3e87970a40f698fb4f545be488.48.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/cc5eb04f80f545f986ae0286cfa82e13/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ta8MbzOIZF9EtTb4SdUMtdpqraXpcjuYuwzz3MG6Iwo',
  voidUrl: 'https://default43cd3e87970a40f698fb4f545be488.48.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/fccb6fb3b0fe4bd19ce79824455336bc/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Y9DDan14Fdv3X-aB3m995yx3qnDlft3scNM_-NgOYq8',
  reopenUrl: 'https://default43cd3e87970a40f698fb4f545be488.48.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/69b29f4eecc04729a8b1a9891a290d3d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=CWCaHQYhpx_Ypwwkey_H9mX7_ufHp_IGIXlxKua9WPM'
};

let config = { ...DEFAULT_CONFIG, truck:'all' };
let activeTab = 'open';
let allOrders = [];
let pendingSync = {}; // orderId -> 'bump' | 'void' | 'reopen' — cleared once confirmed synced
let pollTimer = null;
const POLL_INTERVAL = 2000;

/* ---------- sound ---------- */
let soundEnabled = true;
let audioCtx = null;
let knownOpenIds = null; // null = not initialized yet (first load, no chime)

function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function unlockAudio(){
  const ctx = getAudioCtx();
  if(ctx.state === 'suspended') ctx.resume();
}
document.addEventListener('click', unlockAudio, { once:false });

function playBell(){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx();
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // Limiter lets us push volume up noticeably without the harsh clipping/
    // distortion that would come from just raising gain values directly.
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -14;
    limiter.knee.value = 6;
    limiter.ratio.value = 10;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.15;
    limiter.connect(ctx.destination);

    // Raised fundamental — higher pitch cuts through better on small/external
    // tablet speakers than the previous, warmer tone did.
    const fundamental = 380;
    const partials = [1, 2, 2.76];
    const levels =   [0.62, 0.30, 0.18];

    partials.forEach((ratio, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 3000;
      osc.type = 'sine';
      osc.frequency.value = fundamental * ratio;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(levels[i], now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(filter).connect(gain).connect(limiter);
      osc.start(now);
      osc.stop(now + 0.95);
    });

    // Brief filtered noise burst for a soft mallet-strike transient
    const bufferSize = Math.floor(ctx.sampleRate * 0.04);
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 1600;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.3, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
    noise.connect(noiseFilter).connect(noiseGain).connect(limiter);
    noise.start(now);
  } catch(e){ /* audio unavailable on this device/browser */ }
}

function toggleSound(){
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').classList.toggle('muted', !soundEnabled);
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔔' : '🔕';
  unlockAudio();
  if(soundEnabled) playBell();
  try{ localStorage.setItem('lgcd-kds-sound', soundEnabled ? '1':'0'); } catch(e){}
}

function saveConfig(){
  config.supaUrl = document.getElementById('cfgSupaUrl').value.trim().replace(/\/$/,'');
  config.supaKey = document.getElementById('cfgSupaKey').value.trim();
  config.bumpUrl = document.getElementById('cfgBumpUrl').value.trim();
  config.voidUrl = document.getElementById('cfgVoidUrl').value.trim();
  config.reopenUrl = document.getElementById('cfgReopenUrl').value.trim();
  config.truck   = document.getElementById('cfgTruck').value;
  try{ localStorage.setItem('lgcd-kds-config', JSON.stringify(config)); } catch(e){}
  const note = document.getElementById('savedNote');
  note.style.display = 'block';
  setTimeout(()=> note.style.display='none', 1500);
  loadMenuNames();
  fetchOrders();
}

function loadConfig(){
  try{
    const saved = localStorage.getItem('lgcd-kds-config');
    if(saved) config = { ...config, ...JSON.parse(saved) };
  } catch(e){}

  // URL param locks this physical device to one truck — e.g. kds.html?truck=van
  // Prevents ever showing the wrong vehicle's orders on a device that should only show one.
  const params = new URLSearchParams(window.location.search);
  const urlTruck = params.get('truck');
  if(urlTruck === 'van' || urlTruck === 'trailer') config.truck = urlTruck;

  // ?view=display removes the Bump button — for a station that only needs to watch
  // order flow (e.g. the make table), not mark things ready.
  config.viewOnly = params.get('view') === 'display';

  document.getElementById('cfgSupaUrl').value = config.supaUrl || '';
  document.getElementById('cfgSupaKey').value = config.supaKey || '';
  document.getElementById('cfgBumpUrl').value = config.bumpUrl || '';
  document.getElementById('cfgVoidUrl').value = config.voidUrl || '';
  document.getElementById('cfgReopenUrl').value = config.reopenUrl || '';
  document.getElementById('cfgTruck').value = config.truck || 'all';

  if(urlTruck === 'van' || urlTruck === 'trailer'){
    const sel = document.getElementById('cfgTruck');
    sel.disabled = true;
    sel.title = 'Locked via URL for this device';
    const banner = document.createElement('div');
    banner.style.cssText = 'font-size:11px; color:var(--butter); margin-top:6px;';
    banner.textContent = '🔒 Locked to ' + urlTruck.toUpperCase() + ' for this device';
    sel.insertAdjacentElement('afterend', banner);
  }
}

async function loadMenuNames(){
  if(!config.supaUrl || !config.supaKey) return;
  try{
    const res = await fetch(`${config.supaUrl}/rest/v1/menu_items?select=id,name`, {
      headers:{ 'apikey': config.supaKey, 'Authorization': 'Bearer '+config.supaKey }
    });
    if(!res.ok) return;
    const rows = await res.json();
    MENU_NAMES = {};
    rows.forEach(r => MENU_NAMES[r.id] = r.name);
    render();
  } catch(e){ /* falls back to showing raw item ids if this fails */ }
}

function switchTab(tab){
  activeTab = tab;
  document.getElementById('tabOpen').classList.toggle('active', tab==='open');
  document.getElementById('tabDone').classList.toggle('active', tab==='done');
  document.getElementById('tabTotals').classList.toggle('active', tab==='totals');
  document.getElementById('railWrap').style.display = (tab==='totals') ? 'none' : 'block';
  document.getElementById('totalsView').style.display = (tab==='totals') ? 'block' : 'none';
  if(tab === 'totals') loadComparisons();
  render();
}

function startOfTodayISO(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d.toISOString();
}

async function fetchOrders(){
  if(!config.supaUrl || !config.supaKey) return;
  try{
    const since = startOfTodayISO();
    let url = `${config.supaUrl}/rest/v1/orders?created_at=gte.${since}&status=in.(paid,done)&order=created_at.asc&select=*`;
    const res = await fetch(url, {
      headers:{ 'apikey': config.supaKey, 'Authorization': 'Bearer '+config.supaKey }
    });
    if(!res.ok) return;
    allOrders = await res.json();

    // Reconcile anything we optimistically actioned. If the server now agrees,
    // stop flagging it. If it doesn't (a bump/void/reopen that hasn't landed
    // yet, or genuinely failed), it stays flagged so the ticket reads as
    // "syncing" rather than looking like a brand new order.
    const fetchedIds = new Set(allOrders.map(o => o.id));
    Object.keys(pendingSync).forEach(id => {
      const action = pendingSync[id];
      const order = allOrders.find(o => o.id === id);
      if(action === 'void' && !fetchedIds.has(id)){
        delete pendingSync[id]; // confirmed gone
      } else if(action === 'bump' && order && order.status === 'done'){
        delete pendingSync[id]; // confirmed bumped
      } else if(action === 'reopen' && order && order.status === 'paid'){
        delete pendingSync[id]; // confirmed reopened
      }
    });

    const currentOpenIds = new Set(allOrders.filter(o => o.status === 'paid').map(o => o.id));
    if(knownOpenIds !== null){
      let hasNew = false;
      currentOpenIds.forEach(id => { if(!knownOpenIds.has(id) && !pendingSync[id]) hasNew = true; });
      if(hasNew) playBell();
    }
    knownOpenIds = currentOpenIds;

    render();
  } catch(e){ /* transient network hiccup, next poll retries */ }
}

function filteredByTruck(list){
  if(config.truck === 'all') return list;
  return list.filter(o => o.truck === config.truck);
}

function elapsedLabel(createdAt){
  const mins = Math.max(0, Math.floor((Date.now() - new Date(createdAt).getTime())/60000));
  if(mins < 1) return 'just now';
  return mins + ' min ago';
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function renderItems(items){
  return Object.entries(items || {}).map(([id,qty]) => `
    <div class="litem"><span><span class="q">${qty}×</span>${escapeHtml(MENU_NAMES[id] || id)}</span></div>
  `).join('');
}

function render(){
  const open = filteredByTruck(allOrders.filter(o => o.status === 'paid'))
                .sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  const done = filteredByTruck(allOrders.filter(o => o.status === 'done'))
                .sort((a,b)=> new Date(b.completed_at || b.created_at) - new Date(a.completed_at || a.created_at));

  document.getElementById('openCount').textContent = open.length;
  document.getElementById('doneCount').textContent = done.length;

  if(activeTab === 'totals'){ renderTotals(open.concat(done)); return; }

  const list = activeTab === 'open' ? open : done;
  const rail = document.getElementById('rail');
  const empty = document.getElementById('emptyState');

  if(list.length === 0){
    rail.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = activeTab === 'open' ? 'No open orders right now.' : 'Nothing completed yet today.';
    return;
  }
  empty.style.display = 'none';

  rail.innerHTML = list.map(o => {
    const isOpen = o.status === 'paid';
    const isCash = o.payment_method === 'cash';
    const secs = Math.floor((Date.now() - new Date(o.created_at).getTime())/1000);
    const mins = Math.floor(secs/60);
    const warnClass = (isOpen && mins >= 10) ? 'warn' : '';
    let ageClass = '';
    if(isOpen){
      if(secs >= 120) ageClass = 'ticket-red';
      else if(secs >= 60) ageClass = 'ticket-yellow';
    }
    return `
      <div class="ticket ${ageClass}">
        <div class="jagged"></div>
        <button class="voidBtn" onclick="voidOrder('${o.id}', this)" title="Void this order">✕</button>
        ${pendingSync[o.id] ? `<div class="resyncBadge">↻ Syncing — already actioned, catching up</div>` : ''}
        ${isOpen && isCash ? `<div class="cashFlag">💵 CASH DUE<br>$${Number(o.total_amount).toFixed(2)}</div>` : ''}
        <div class="ttop">
          <div class="tname">${escapeHtml(o.customer_name || 'Guest')}</div>
          <div class="ttruck">${escapeHtml(o.truck || '')}</div>
        </div>
        <div class="telapsed ${warnClass}">${isOpen ? elapsedLabel(o.created_at) : 'placed ' + elapsedLabel(o.created_at)}</div>
        <hr>
        ${renderItems(o.items)}
        ${isOpen
          ? (config.viewOnly
              ? `<div class="watchLabel">👀 In Progress</div>`
              : `<button class="bumpBtn" onclick="bumpOrder('${o.id}', this)">Bump — Ready</button>`)
          : `
          <div class="doneStamp">DONE</div>
          <div class="doneTime">completed ${o.completed_at ? elapsedLabel(o.completed_at) : ''}</div>
          ${config.viewOnly ? '' : `<button class="reopenBtn" onclick="reopenOrder('${o.id}', this)">↩ Move to Open</button>`}
        `}
      </div>
    `;
  }).join('');
}

function renderTotals(orders){
  const totals = {};
  let revenue = 0, taxCollected = 0, tipsCollected = 0, cashTotal = 0, cardTotal = 0;
  orders.forEach(o => {
    revenue += Number(o.total_amount || 0);
    taxCollected += Number(o.tax_amount || 0);
    tipsCollected += Number(o.tip_amount || 0);
    if(o.payment_method === 'cash') cashTotal += Number(o.total_amount || 0);
    else cardTotal += Number(o.total_amount || 0);
    Object.entries(o.items || {}).forEach(([id,qty]) => {
      totals[id] = (totals[id] || 0) + Number(qty);
    });
  });
  const rows = Object.entries(totals).sort((a,b)=> b[1]-a[1]);

  const view = document.getElementById('totalsLiveStats');
  view.innerHTML = `
    <div class="summaryCard">
      <div><div class="label">Orders Today</div><div class="big">${orders.length}</div></div>
      <div><div class="label">Revenue</div><div class="big">$${revenue.toFixed(2)}</div></div>
    </div>
    <div class="summaryCard">
      <div><div class="label">Tax Collected</div><div class="big">$${taxCollected.toFixed(2)}</div></div>
      <div><div class="label">Tips Collected</div><div class="big">$${tipsCollected.toFixed(2)}</div></div>
    </div>
    <div class="summaryCard">
      <div><div class="label">Cash / Card</div><div class="big" style="font-size:18px;">$${cashTotal.toFixed(2)} / $${cardTotal.toFixed(2)}</div></div>
    </div>
    ${rows.length === 0 ? '<div id="emptyState" style="display:block;">Nothing sold yet today.</div>' :
      rows.map(([id,qty]) => `
        <div class="statRow">
          <div class="name">${escapeHtml(MENU_NAMES[id] || id)}</div>
          <div class="qty">${qty}</div>
        </div>
      `).join('')
    }
  `;
}

function shiftDate(date, { days = 0, months = 0, years = 0 }){
  const d = new Date(date);
  if(years) d.setFullYear(d.getFullYear() + years);
  if(months) d.setMonth(d.getMonth() + months);
  if(days) d.setDate(d.getDate() + days);
  return d;
}

function dayRangeISO(date){
  const start = new Date(date);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(end.getDate() + 1);
  return {
    startISO: start.toISOString(),
    endISO: end.toISOString(),
    label: start.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })
  };
}

async function fetchDayTotal(date){
  const { startISO, endISO, label } = dayRangeISO(date);
  try{
    const url = `${config.supaUrl}/rest/v1/orders?created_at=gte.${startISO}&created_at=lt.${endISO}&status=in.(paid,done)&select=total_amount`;
    const res = await fetch(url, { headers:{ 'apikey': config.supaKey, 'Authorization': 'Bearer '+config.supaKey } });
    if(!res.ok) return { label, orders:0, revenue:0 };
    const rows = await res.json();
    const revenue = rows.reduce((sum,o) => sum + Number(o.total_amount || 0), 0);
    return { label, orders: rows.length, revenue };
  } catch(e){
    return { label, orders:0, revenue:0 };
  }
}

async function loadComparisons(){
  const now = new Date();
  const [lastWeek, lastMonth, lastYear] = await Promise.all([
    fetchDayTotal(shiftDate(now, { days: -7 })),
    fetchDayTotal(shiftDate(now, { months: -1 })),
    fetchDayTotal(shiftDate(now, { years: -1 })),
  ]);

  const container = document.getElementById('compareRow');
  if(!container) return; // user navigated away before this resolved

  const card = (title, data) => `
    <div class="compCard">
      <div class="compTitle">${title}</div>
      <div class="compDate">${data.label}</div>
      ${data.orders > 0
        ? `<div class="compOrders">${data.orders} orders</div><div class="compRevenue">$${data.revenue.toFixed(2)}</div>`
        : `<div class="compNoData">No data</div>`
      }
    </div>
  `;
  container.innerHTML = card('Last Week', lastWeek) + card('Last Month', lastMonth) + card('Last Year', lastYear);
}

// Fires a flow call, but doesn't let a slow response stall the UI. If it hasn't
// heard back within timeoutMs, moves on optimistically and just confirms quietly
// in the background — a slow Power Automate run shouldn't stall the kitchen.
// Fires an action in the background with a few retries, spaced out to give a
// flaky connection a real chance to recover. Doesn't block or update the UI —
// that already happened the instant the button was tapped. If every attempt
// genuinely fails, the next regular poll (which always reflects the real
// server state) will pull the ticket back to where it actually belongs —
// so nothing is silently lost even in the worst case.
function sendInBackground(url, orderId, label, attempt = 1){
  const maxAttempts = 5;
  fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ order_id: orderId })
  }).then(res => {
    if(!res.ok) throw new Error('HTTP ' + res.status);
    // succeeded — nothing further to do
  }).catch(() => {
    if(attempt < maxAttempts){
      setTimeout(() => sendInBackground(url, orderId, label, attempt + 1), attempt * 1500);
    } else {
      console.warn(`${label} for order ${orderId} failed after ${maxAttempts} attempts on a shaky connection — it'll reappear on the rail on the next refresh if it truly didn't go through.`);
    }
  });
}

function bumpOrder(orderId, btnEl){
  if(!config.bumpUrl){ alert('Set the Bump Order Flow URL in setup first.'); return; }
  if(btnEl) btnEl.disabled = true;

  pendingSync[orderId] = 'bump';
  const order = allOrders.find(o => o.id === orderId);
  if(order){
    order.status = 'done';
    order.completed_at = new Date().toISOString();
  }
  render();

  sendInBackground(config.bumpUrl, orderId, 'Bump');
}

function voidOrder(orderId, btnEl){
  if(!config.voidUrl){ alert('Set the Void Order Flow URL in setup first.'); return; }
  const ok = confirm('Void this order? This permanently removes it — use only for test transactions or genuine mistakes. This cannot be undone.');
  if(!ok) return;
  if(btnEl) btnEl.disabled = true;

  pendingSync[orderId] = 'void';
  allOrders = allOrders.filter(o => o.id !== orderId);
  render();

  sendInBackground(config.voidUrl, orderId, 'Void');
}

function reopenOrder(orderId, btnEl){
  if(!config.reopenUrl){ alert('Set the Reopen Order Flow URL in setup first.'); return; }
  if(btnEl) btnEl.disabled = true;

  pendingSync[orderId] = 'reopen';
  const order = allOrders.find(o => o.id === orderId);
  if(order){
    order.status = 'paid';
    order.completed_at = null;
  }
  render();

  sendInBackground(config.reopenUrl, orderId, 'Reopen');
}
