<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Let's Go Cookie Dough — Order</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --dough:#454A5E;
    --dough-2:#565C74;
    --cream:#F7F1E3;
    --butter:#D9993D;
    --sky:#8FC1DE;
    --jam:#C1442E;
    --jam-dark:#9C3320;
    --ok:#5B8C5A;
    --ink:#1B2430;
    --line: rgba(247,241,227,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--dough);
    color:var(--cream);
    font-family:'Nunito',sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}

  /* ---------- config drawer ---------- */
  #configBtn{
    position:fixed; top:10px; right:10px; z-index:50;
    width:34px; height:34px; border-radius:50%;
    background:rgba(247,241,227,0.08); border:1px solid var(--line);
    color:var(--cream); font-size:16px; cursor:pointer;
  }
  #configPanel{
    position:fixed; top:0; right:0; height:100%; width:320px; max-width:88vw;
    background:var(--dough-2); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .25s ease;
    z-index:49; padding:60px 20px 20px; overflow-y:auto;
  }
  #configPanel.open{transform:translateX(0);}
  #configPanel label{display:block; font-size:12px; opacity:.75; margin:14px 0 4px;}
  #configPanel input, #configPanel select{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:rgba(247,241,227,0.06); color:var(--cream); font-size:14px;
  }
  #configPanel .savedNote{font-size:12px; color:var(--ok); margin-top:10px; display:none;}

  /* ---------- header ---------- */
  header{
    padding:28px 20px 14px; text-align:center; position:relative;
  }
  header .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.6;
  }
  header h1{
    font-size:clamp(28px,5vw,40px); margin:4px 0 2px; font-weight:700;
    color:var(--cream);
    text-shadow:
      -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink),
      0 4px 0 var(--sky);
  }
  header .truckTag{
    display:inline-block; margin-top:10px; padding:4px 14px; border-radius:20px;
    background:rgba(143,193,222,0.18); border:1px solid rgba(143,193,222,0.5);
    font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--sky);
  }

  /* ---------- menu ---------- */
  main{max-width:640px; margin:0 auto; padding:10px 16px 160px;}
  .menuGrid{display:grid; grid-template-columns:1fr; gap:12px; margin-top:18px;}
  .item{
    display:flex; align-items:center; gap:14px;
    background:var(--dough-2); border:1px solid var(--line); border-radius:16px;
    padding:14px 18px;
  }
  .item .thumb{
    width:56px; height:56px; border-radius:12px; flex-shrink:0;
    background-size:cover; background-position:center;
    background-color:rgba(217,153,61,0.18);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:20px; color:var(--butter);
    border:1px solid var(--line);
  }
  .item .info{flex:1; min-width:0;}
  .item .info .name{font-family:'Fredoka',sans-serif; font-size:19px; font-weight:600;}
  .item .info .price{font-size:14px; opacity:.65; margin-top:2px;}
  .item .info .ingredients{font-size:11px; opacity:.45; margin-top:4px; line-height:1.4;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{
    width:38px; height:38px; border-radius:10px; border:none; cursor:pointer;
    background:rgba(247,241,227,0.1); color:var(--cream); font-size:20px; font-weight:700;
  }
  .stepper button.plus{background:var(--butter); color:var(--dough);}
  .stepper .qty{min-width:22px; text-align:center; font-weight:800; font-size:16px;}

  /* ---------- cart bar ---------- */
  #cartBar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:var(--dough-2); border-top:1px solid var(--line);
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between;
    transform:translateY(100%); transition:transform .25s ease;
  }
  #cartBar.visible{transform:translateY(0);}
  #cartBar .row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  #cartBar .totalWrap .label{font-size:11px; opacity:.6; text-transform:uppercase; letter-spacing:.08em;}
  #cartBar .totalWrap .amount{font-family:'Fredoka',sans-serif; font-size:24px; font-weight:700; color:var(--butter);}
  #cartBar button{
    background:var(--butter); color:var(--ink); border:none; border-radius:14px;
    padding:16px 28px; font-size:16px; font-weight:800; font-family:'Fredoka',sans-serif;
    cursor:pointer; letter-spacing:.02em;
  }
  #cartBar button:active{opacity:.85;}

  /* ---------- name prompt ---------- */
  #namePrompt input{
    width:100%; max-width:320px; padding:18px 20px; margin:0 0 22px;
    border-radius:14px; border:2px solid var(--sky);
    background:rgba(247,241,227,0.08); color:var(--cream);
    font-size:22px; text-align:center; font-family:'Fredoka',sans-serif;
  }
  #namePrompt input::placeholder{color:rgba(247,241,227,0.4); font-size:17px;}
  #namePrompt .continueBtn{
    background:var(--butter); color:var(--ink); border:none; border-radius:14px;
    padding:16px 40px; font-size:17px; font-weight:800; font-family:'Fredoka',sans-serif;
    cursor:pointer; letter-spacing:.02em;
  }
  #namePrompt .continueBtn:disabled{opacity:.35;}
  #namePrompt .skipHint{font-size:12px; opacity:.5; margin-top:16px;}

  /* ---------- allergen warning ---------- */
  #allergenPrompt{max-width:340px;}
  #allergenPrompt .warnIcon{font-size:44px; margin-bottom:6px;}
  #allergenPrompt .allergenLine{
    text-align:left; background:rgba(193,68,46,0.14); border:1px solid rgba(193,68,46,0.4);
    border-radius:12px; padding:12px 14px; margin:0 0 12px; font-size:15px;
  }
  #allergenPrompt .allergenLine strong{color:var(--jam); display:block; margin-bottom:2px; font-size:14px;}
  #allergenPrompt .continueBtn{margin-top:8px;}
  #allergenPrompt .ghostBtn{margin-top:10px;}

  /* ---------- overlay states ---------- */
  #overlay{
    position:fixed; inset:0; background:var(--dough); z-index:60;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #overlay.show{display:flex;}
  .spinner{
    width:64px; height:64px; border-radius:50%;
    border:5px solid rgba(232,184,75,0.2); border-top-color:var(--butter);
    animation:spin 0.9s linear infinite; margin-bottom:24px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #overlay h2{font-size:26px; margin:0 0 8px;}
  #overlay p{opacity:.7; font-size:15px; max-width:320px; margin:0 0 26px;}
  #overlay .checkAmt{font-family:'Fredoka',sans-serif; font-size:38px; color:var(--butter); margin-bottom:6px;}
  #overlay .successMark{
    width:76px; height:76px; border-radius:50%; background:var(--ok);
    display:flex; align-items:center; justify-content:center; margin-bottom:22px;
    font-size:38px;
  }
  #overlay .failMark{
    width:76px; height:76px; border-radius:50%; background:var(--jam);
    display:flex; align-items:center; justify-content:center; margin-bottom:22px;
    font-size:34px;
  }
  #overlay .ghostBtn{
    margin-top:6px; background:transparent; border:1px solid var(--line); color:var(--cream);
    padding:12px 22px; border-radius:12px; font-size:14px; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:700;
  }
  #overlay .orderNum{font-size:13px; opacity:.55; margin-top:-14px; margin-bottom:20px;}
</style>
</head>
<body>

<button id="configBtn" onclick="document.getElementById('configPanel').classList.toggle('open')">⚙</button>
<div id="configPanel">
  <h3 style="margin:0 0 4px;">Setup</h3>
  <p style="font-size:12px; opacity:.6; margin:0;">Enter your project values. Nothing here is saved anywhere except this tab's memory.</p>

  <label>Supabase Project URL</label>
  <input id="cfgSupaUrl" placeholder="https://xxxxx.supabase.co">

  <label>Supabase Publishable Key</label>
  <input id="cfgSupaKey" placeholder="sb_publishable_...">

  <label>Power Automate — Create Checkout Flow URL</label>
  <input id="cfgFlowUrl" placeholder="https://prod-xx...invoke?...">

  <label>Truck</label>
  <select id="cfgTruck">
    <option value="van">Van</option>
    <option value="trailer">Trailer</option>
  </select>

  <label>Paired Square Terminal Device ID</label>
  <input id="cfgDeviceId" placeholder="e.g. 9fa747a2-25ff-...">

  <button onclick="saveConfig()" style="margin-top:18px; width:100%; padding:10px; border-radius:8px; border:none; background:var(--butter); color:var(--dough); font-weight:800; cursor:pointer;">Save</button>
  <div class="savedNote" id="savedNote">Saved for this session ✓</div>
</div>

<header>
  <div class="eyebrow">Let's Go Cookie Dough</div>
  <h1>Build Your Order</h1>
  <span class="truckTag" id="truckTag">VAN</span>
</header>

<main>
  <div class="menuGrid" id="menuGrid"></div>
</main>

<div id="cartBar">
  <div class="row">
    <div class="totalWrap">
      <div class="label">Total</div>
      <div class="amount" id="cartTotal">$0.00</div>
    </div>
    <button id="checkoutBtn" onclick="checkAllergensAndProceed()">Checkout</button>
  </div>
</div>

<div id="overlay"></div>

<script>
let MENU = [];

let cart = {};       // { itemId: qty }
let config = { supaUrl:'', supaKey:'', flowUrl:'', truck:'van', deviceId:'' };
let currentOrderId = null;
let pollTimer = null;
let pollElapsed = 0;
const POLL_INTERVAL = 2000;
const POLL_TIMEOUT_MS = 90000;

function saveConfig(){
  config.supaUrl = document.getElementById('cfgSupaUrl').value.trim().replace(/\/$/,'');
  config.supaKey = document.getElementById('cfgSupaKey').value.trim();
  config.flowUrl = document.getElementById('cfgFlowUrl').value.trim();
  config.truck   = document.getElementById('cfgTruck').value;
  config.deviceId = document.getElementById('cfgDeviceId').value.trim();
  document.getElementById('truckTag').textContent = config.truck.toUpperCase();

  try{
    localStorage.setItem('lgcd-kiosk-config', JSON.stringify(config));
  } catch(e){ /* storage unavailable — config still works for this session */ }

  const note = document.getElementById('savedNote');
  note.style.display = 'block';
  setTimeout(()=> note.style.display='none', 1800);
  loadMenu();
}

function loadConfig(){
  try{
    const saved = localStorage.getItem('lgcd-kiosk-config');
    if(saved) config = { ...config, ...JSON.parse(saved) };
  } catch(e){ /* no saved config yet, or storage unavailable */ }

  // URL params override saved config — lets each physical device be pre-configured
  // e.g. kiosk.html?truck=van&device=ABC123 locks that device to Van + its paired terminal
  const params = new URLSearchParams(window.location.search);
  const urlTruck = params.get('truck');
  const urlDevice = params.get('device');
  if(urlTruck === 'van' || urlTruck === 'trailer') config.truck = urlTruck;
  if(urlDevice) config.deviceId = urlDevice;

  document.getElementById('cfgSupaUrl').value = config.supaUrl || '';
  document.getElementById('cfgSupaKey').value = config.supaKey || '';
  document.getElementById('cfgFlowUrl').value = config.flowUrl || '';
  document.getElementById('cfgTruck').value = config.truck || 'van';
  document.getElementById('cfgDeviceId').value = config.deviceId || '';
  document.getElementById('truckTag').textContent = (config.truck || 'van').toUpperCase();

  if(urlTruck === 'van' || urlTruck === 'trailer'){
    const sel = document.getElementById('cfgTruck');
    sel.disabled = true;
    sel.title = 'Locked via URL for this device';
  }
  if(urlDevice){
    const dev = document.getElementById('cfgDeviceId');
    dev.disabled = true;
    dev.title = 'Locked via URL for this device';
  }
}

async function loadMenu(){
  const grid = document.getElementById('menuGrid');
  if(!config.supaUrl || !config.supaKey){
    grid.innerHTML = '<p style="opacity:.55; text-align:center; padding:30px 10px;">Set up your project in the gear icon above to load the menu.</p>';
    return;
  }
  try{
    const res = await fetch(`${config.supaUrl}/rest/v1/menu_items?select=*&order=sort_order.asc`, {
      headers:{ 'apikey': config.supaKey, 'Authorization': 'Bearer '+config.supaKey }
    });
    if(!res.ok) throw new Error();
    const rows = await res.json();
    const truck = config.truck === 'trailer' ? 'trailer' : 'van';
    MENU = rows
      .filter(r => r['available_'+truck])
      .map(r => ({
        id:r.id, name:r.name, price:Number(r['price_'+truck]),
        ingredients:r.ingredients || '', allergenWarning:r.allergen_warning || '',
        imageUrl:r.image_url || ''
      }));
    renderMenu();
  } catch(e){
    grid.innerHTML = '<p style="opacity:.55; text-align:center; padding:30px 10px;">Could not load the menu. Check your setup values.</p>';
  }
}

function renderMenu(){
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = MENU.map(item => `
    <div class="item">
      <div class="thumb" style="${item.imageUrl ? `background-image:url('${item.imageUrl}')` : ''}">
        ${item.imageUrl ? '' : escapeHtml((item.name||'?').charAt(0))}
      </div>
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="price">$${item.price.toFixed(2)}</div>
        ${item.ingredients ? `<div class="ingredients">${escapeHtml(item.ingredients)}</div>` : ''}
      </div>
      <div class="stepper">
        <button onclick="changeQty('${item.id}', -1)">−</button>
        <span class="qty" id="qty-${item.id}">0</span>
        <button class="plus" onclick="changeQty('${item.id}', 1)">+</button>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta){
  const current = cart[id] || 0;
  const next = Math.max(0, current + delta);
  if(next === 0) delete cart[id]; else cart[id] = next;
  document.getElementById('qty-'+id).textContent = next;
  updateCartBar();
}

function cartTotalAmount(){
  return Object.entries(cart).reduce((sum,[id,qty])=>{
    const item = MENU.find(m=>m.id===id);
    return sum + (item ? item.price*qty : 0);
  }, 0);
}

function updateCartBar(){
  const total = cartTotalAmount();
  const bar = document.getElementById('cartBar');
  document.getElementById('cartTotal').textContent = '$'+total.toFixed(2);
  bar.classList.toggle('visible', total > 0);
}

function showOverlay(html){
  const o = document.getElementById('overlay');
  o.innerHTML = html;
  o.classList.add('show');
}
function hideOverlay(){
  document.getElementById('overlay').classList.remove('show');
}

function checkAllergensAndProceed(){
  const total = cartTotalAmount();
  if(total <= 0) return;

  const flagged = Object.keys(cart)
    .map(id => MENU.find(m => m.id === id))
    .filter(item => item && item.allergenWarning);

  if(flagged.length > 0){
    showAllergenWarning(flagged);
  } else {
    showNamePrompt();
  }
}

function showAllergenWarning(flaggedItems){
  showOverlay(`
    <div id="allergenPrompt">
      <div class="warnIcon">⚠️</div>
      <h2 style="margin-bottom:14px;">Allergen Notice</h2>
      ${flaggedItems.map(item => `
        <div class="allergenLine">
          <strong>${escapeHtml(item.name)}</strong>
          ${escapeHtml(item.allergenWarning)}
        </div>
      `).join('')}
      <button class="continueBtn" onclick="showNamePrompt()">I Understand, Continue</button>
      <br>
      <button class="ghostBtn" onclick="hideOverlay()">Go Back</button>
    </div>
  `);
}

function showNamePrompt(){
  const total = cartTotalAmount();
  if(total <= 0) return;

  showOverlay(`
    <div id="namePrompt">
      <h2 style="margin-bottom:6px;">What's your name?</h2>
      <p style="margin-bottom:20px;">So we can call your order when it's ready.</p>
      <input id="nameInput" type="text" placeholder="First name" maxlength="30" autocomplete="off" autocapitalize="words">
      <br>
      <button class="continueBtn" id="nameContinueBtn" disabled onclick="confirmName()">Continue to Payment</button>
      <div class="skipHint">$${total.toFixed(2)} total</div>
    </div>
  `);

  const input = document.getElementById('nameInput');
  const btn = document.getElementById('nameContinueBtn');
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().length === 0; });
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && input.value.trim()) confirmName(); });
  // Autofocus opens the on-screen keyboard on a touchscreen kiosk
  setTimeout(()=> input.focus(), 150);
}

function confirmName(){
  const input = document.getElementById('nameInput');
  const customerName = input.value.trim();
  if(!customerName) return;
  placeOrder(customerName);
}

async function placeOrder(customerName){
  if(!config.supaUrl || !config.supaKey || !config.flowUrl){
    alert('Fill in the setup panel (gear icon, top right) first.');
    return;
  }
  const total = cartTotalAmount();
  if(total <= 0) return;

  showOverlay(`<div class="spinner"></div><h2>Sending order...</h2><p>Writing your order and starting checkout.</p>`);

  const items = {};
  Object.entries(cart).forEach(([id,qty])=> items[id]=qty);

  try{
    // 1. Write the order to Supabase
    const insertRes = await fetch(`${config.supaUrl}/rest/v1/orders`, {
      method:'POST',
      headers:{
        'apikey': config.supaKey,
        'Authorization': 'Bearer '+config.supaKey,
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      },
      body: JSON.stringify({
        truck: config.truck,
        items: items,
        total_amount: total,
        customer_name: customerName,
        reference_id: crypto.randomUUID()
      })
    });
    if(!insertRes.ok) throw new Error('Could not create order ('+insertRes.status+')');
    const rows = await insertRes.json();
    const order = rows[0];
    currentOrderId = order.id;

    // 2. Fire the checkout flow (Power Automate) with order id + amount
    showOverlay(`
      <div class="checkAmt">$${total.toFixed(2)}</div>
      <div class="spinner"></div>
      <h2>Tap, dip, or swipe</h2>
      <p>Please pay on the terminal now.</p>
      <div class="orderNum">Order ${order.id.slice(0,8)}</div>
    `);

    const flowRes = await fetch(config.flowUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        order_id: order.reference_id,
        amount: Math.round(total*100),
        device_id: config.deviceId
      })
    });
    if(!flowRes.ok) throw new Error('Could not start checkout ('+flowRes.status+')');

    startPolling(order.id, total, customerName);

  } catch(err){
    showOverlay(`
      <div class="failMark">✕</div>
      <h2>Something went wrong</h2>
      <p>${err.message}</p>
      <button class="ghostBtn" onclick="hideOverlay()">Try Again</button>
    `);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

let autoResetTimer = null;
function startAutoReset(seconds){
  clearTimeout(autoResetTimer);
  let remaining = seconds;
  const tick = () => {
    const btn = document.querySelector('#overlay .ghostBtn');
    const base = document.querySelector('#overlay .ghostBtnLabel')?.textContent || null;
    if(btn) btn.textContent = btn.textContent.replace(/\s*\(\d+\)$/,'') + ` (${remaining})`;
    if(remaining <= 0){ resetKiosk(); return; }
    remaining -= 1;
    autoResetTimer = setTimeout(tick, 1000);
  };
  tick();
}

function startPolling(orderId, total, customerName){
  pollElapsed = 0;
  clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    pollElapsed += POLL_INTERVAL;
    if(pollElapsed >= POLL_TIMEOUT_MS){
      clearInterval(pollTimer);
      showOverlay(`
        <div class="failMark">!</div>
        <h2>Taking longer than expected</h2>
        <p>Please see staff for help with your order.</p>
        <button class="ghostBtn" onclick="resetKiosk()">Start Over</button>
      `);
      return;
    }
    try{
      const res = await fetch(`${config.supaUrl}/rest/v1/orders?id=eq.${orderId}&select=status`, {
        headers:{ 'apikey': config.supaKey, 'Authorization': 'Bearer '+config.supaKey }
      });
      const data = await res.json();
      const status = data[0]?.status;
      if(status === 'paid'){
        clearInterval(pollTimer);
        showOverlay(`
          <div class="successMark">✓</div>
          <h2>Order confirmed, ${escapeHtml(customerName)}!</h2>
          <p>We're making it now — grab a spot at the window.</p>
          <button class="ghostBtn" onclick="resetKiosk()">New Order Now</button>
        `);
        startAutoReset(6);
      } else if(status === 'canceled'){
        clearInterval(pollTimer);
        showOverlay(`
          <div class="failMark">✕</div>
          <h2>Payment didn't go through</h2>
          <p>No charge was made. You can try again.</p>
          <button class="ghostBtn" onclick="resetKiosk()">Try Again Now</button>
        `);
        startAutoReset(8);
      }
    } catch(e){ /* transient network hiccup, next poll will retry */ }
  }, POLL_INTERVAL);
}

function resetKiosk(){
  clearTimeout(autoResetTimer);
  cart = {};
  currentOrderId = null;
  renderMenu();
  updateCartBar();
  hideOverlay();
}

loadConfig();
loadMenu();
</script>
</body>
</html>
